[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "assessment-app"
version = "0.1.0"
description = "Real-time colored cube detection, stacking validation, and assessment game"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Assessment App Contributors" }]
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
assessment-app = "assessment_app.app:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # line too long (handled by black)

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/assessment_app --cov-report=term-missing"
